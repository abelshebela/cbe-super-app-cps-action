openapi: 3.0.3
info:
  title: CBE Super App - Account Block API
  description: API for managing account blocks including branches, regions, districts, and cities
  version: 1.0.0
  

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CPS Action API Server

tags:
  - name: Branches
    description: Branch management operations
  - name: Regions
    description: Region management operations
  - name: Districts
    description: District management operations
  - name: Cities
    description: City management operations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    BranchResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the branch
        branch_code:
          type: string
          description: Branch code
        branch_name:
          type: string
          description: Branch name
        branch_address:
          type: string
          description: Branch address
        district_code:
          type: string
          description: District code
        district_name:
          type: string
          description: District name
        branch_region:
          type: string
          description: Branch region
        record_stat:
          type: string
          description: Record status
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the branch is enabled

    RegionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the region
        region_code:
          type: string
          description: Region code
        region_name:
          type: string
          description: Region name
        region_address:
          type: string
          description: Region address
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the region is enabled

    DistrictResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the district
        district_code:
          type: string
          description: District code
        district_name:
          type: string
          description: District name
        district_address:
          type: string
          description: District address
        region_id:
          type: string
          description: Region ID
        region_name:
          type: string
          description: Region name
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the district is enabled

    CityResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the city
        city_code:
          type: string
          description: City code
        city_name:
          type: string
          description: City name
        city_address:
          type: string
          description: City address
        district_id:
          type: string
          description: District ID
        district_name:
          type: string
          description: District name
        region_id:
          type: string
          description: Region ID
        region_name:
          type: string
          description: Region name
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the city is enabled

    EnableOrDisableBranches:
      type: object
      required:
        - branches_code
      properties:
        branches_code:
          type: array
          items:
            type: string
          description: Array of branch codes to enable or disable
          example: ["BR001", "BR002", "BR003"]

    EnableOrDisableRegions:
      type: object
      required:
        - regions_code
      properties:
        regions_code:
          type: array
          items:
            type: string
          description: Array of region codes to enable or disable
          example: ["RG001", "RG002"]

    EnableOrDisableDistricts:
      type: object
      required:
        - districts_code
      properties:
        districts_code:
          type: array
          items:
            type: string
          description: Array of district codes to enable or disable
          example: ["DT001", "DT002"]

    EnableOrDisableCities:
      type: object
      required:
        - city_code
      properties:
        city_code:
          type: array
          items:
            type: string
          description: Array of city codes to enable or disable
          example: ["CT001", "CT002"]

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
        data:
          type: object
          description: Response data

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code

security:
  - BearerAuth: []

paths:
  /api/v1/cbesuperapp/cps_action/account_block/branches:
    get:
      tags:
        - Branches
      summary: Get all branches
      description: Retrieve a list of all branches
      operationId: getAllBranches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully retrieved branches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BranchResponse'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cbesuperapp/cps_action/account_block/branches/{branch_code}:
    get:
      tags:
        - Branches
      summary: Get branch by code
      description: Retrieve a specific branch by its code
      operationId: getBranchByCode
      security:
        - BearerAuth: []
      parameters:
        - name: branch_code
          in: path
          required: true
          description: Branch code
          schema:
            type: string
            example: "BR001"
      responses:
        '200':
          description: Successfully retrieved branch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BranchResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cbesuperapp/cps_action/account_block/branches/enable:
    post:
      tags:
        - Branches
      summary: Enable branches
      description: Enable one or more branches by their codes
      operationId: enableBranches
      security:
        - BearerAuth: []
      requestBody:
        required: true
