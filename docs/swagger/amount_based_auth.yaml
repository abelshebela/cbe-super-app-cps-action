openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Amount Based Authentication API
  description: |
    This API provides endpoints for managing amount-based authentication rules in the CBE Super App CPS Action module.
    It allows configuring different authentication methods based on transaction amounts.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Request/Response Schemas
    UpdateAmountBasedAuthRequest:
      type: object
      properties:
        min_amount:
          type: integer
          format: uint64
          minimum: 0
          description: Minimum amount for the authentication method (required for PIN and OTP+PIN methods)
          example: 1000
        max_amount:
          type: integer
          format: uint64
          minimum: 0
          description: Maximum amount for the authentication method (required for OPEN and PIN methods)
          example: 10000
      
    CPSAction:
      type: object
      properties:
        id:
          type: string
          description: Action ID
          example: act_1234567890
        status:
          type: string
          description: Action status
          example: rejected
        reason:
          type: string
          description: Reason for rejection (if applicable)
          example: Invalid amount range
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: Amount Based Authentication
    description: Amount-based authentication rules management

paths:
  /amount-based-auth:
    get:
      tags:
        - Amount Based Authentication
      summary: Get all amount-based authentication rules
      description: Retrieve a paginated list of all amount-based authentication rules
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of amount-based authentication rules retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Amount-based authentication rules retrieved successfully
                data:
                  items:
                    - id: 1
                      method: "OPEN"
                      min_amount: 0
                      max_amount: 1000
                    - id: 2
                      method: "PIN"
                      min_amount: 1001
                      max_amount: 10000
                    - id: 3
                      method: "OTP_PIN"
                      min_amount: 10001
                      max_amount: 0
                  meta:
                    total: 3
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /amount-based-auth/{id}/method/{method}:
    put:
      tags:
        - Amount Based Authentication
      summary: Update amount-based authentication rule
      description: Update an existing amount-based authentication rule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the rule to update
          schema:
            type: string
          example: 1
        - name: method
          in: path
          required: true
          description: Authentication method (OPEN, PIN, or OTP_PIN)
          schema:
            type: string
            enum: [OPEN, PIN, OTP_PIN]
          example: PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAmountBasedAuthRequest'
      responses:
        '200':
          description: Amount-based authentication rule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Amount-based authentication rule updated successfully
                data: null
        '400':
          description: |
            Bad Request. Possible error codes:
            - ERR_INVALID_INPUT: Invalid input parameters
            - ERR_INVALID_METHOD: Invalid authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /amount-based-auth/{id}/reject:
    post:
      tags:
        - Amount Based Authentication
      summary: Reject amount-based authentication change
      description: Reject a pending amount-based authentication rule change
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the rule change to reject
          schema:
            type: string
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CPSAction'
      responses:
        '200':
          description: Amount-based authentication change rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Amount-based authentication change rejected successfully
                data:
                  id: act_1234567890
                  status: rejected
                  reason: Invalid amount range
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
