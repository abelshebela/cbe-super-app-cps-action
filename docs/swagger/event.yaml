openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Event Management API
  description: |
    This API provides endpoints for managing events in the CBE Super App CPS Action module.
    It allows creating, updating, retrieving, and managing events with their associated tickets.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    EventRequest:
      type: object
      required:
        - account_number
        - merchant_id
        - merchant_name
        - merchant_phone_number
        - event_name
        - event_venue
        - event_city
        - start_date
        - due_date
        - event_description
        - total_ticket_count
        - tickets
      properties:
        account_number:
          type: string
          description: Bank account number for the event
          example: "1000000000001"
        merchant_id:
          type: string
          description: ID of the merchant organizing the event
          example: "507f1f77bcf86cd799439011"
        merchant_name:
          type: string
          description: Name of the merchant organizing the event
          example: "Event Organizers PLC"
        merchant_phone_number:
          type: string
          description: Contact phone number of the merchant
          example: "+251911223344"
        merchant_email:
          type: string
          format: email
          description: Contact email of the merchant
          example: "organizer@example.com"
        event_name:
          type: string
          description: Name of the event
          example: "Annual Music Festival"
        event_venue:
          type: string
          description: Venue where the event will take place
          example: "Millennium Hall"
        event_city:
          type: string
          description: City where the event will take place
          example: "Addis Ababa"
        start_date:
          type: string
          format: date-time
          description: Start date and time of the event
          example: "2023-12-31T20:00:00Z"
        due_date:
          type: string
          format: date-time
          description: End date and time of the event
          example: "2024-01-01T06:00:00Z"
        cover_image:
          type: string
          format: binary
          description: Cover image for the event
        event_description:
          type: string
          description: Detailed description of the event
          example: "Join us for a night of amazing music and performances from top artists."
        total_ticket_count:
          type: integer
          minimum: 1
          description: Total number of tickets available for the event
          example: 1000
        tickets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TicketRequest'
    
    TicketRequest:
      type: object
      required:
        - name
        - price
        - count
      properties:
        name:
          type: string
          description: Name/type of the ticket
          example: "VIP"
        price:
          type: number
          minimum: 0
          description: Price of the ticket in ETB
          example: 1000
        count:
          type: integer
          minimum: 1
          description: Number of tickets available for this type
          example: 100
    
    EventResponse:
      type: object
      properties:
        event_id:
          type: string
          description: Unique identifier for the event
          example: "507f1f77bcf86cd799439011"
        event_code:
          type: string
          description: Unique code for the event
          example: "EVT-2023-001"
        cover_image:
          type: string
          format: uri
          description: URL of the event's cover image
          example: "https://example.com/events/cover.jpg"
        event_name:
          type: string
          description: Name of the event
          example: "Annual Music Festival"
        event_description:
          type: string
          description: Detailed description of the event
          example: "Join us for a night of amazing music and performances from top artists."
        total_ticket_count:
          type: integer
          description: Total number of tickets available for the event
          example: 1000
        event_startdate:
          type: string
          format: date-time
          description: Start date and time of the event
          example: "2023-12-31T20:00:00Z"
        event_enddate:
          type: string
          format: date-time
          description: End date and time of the event
          example: "2024-01-01T06:00:00Z"
        event_status:
          type: string
          description: Current status of the event
          enum: ["upcoming", "ongoing", "completed", "cancelled"]
          example: "upcoming"
        event_venue:
          type: string
          description: Venue where the event will take place
          example: "Millennium Hall"
        event_city:
          type: string
          description: City where the event will take place
          example: "Addis Ababa"
        enabled:
          type: boolean
          description: Whether the event is enabled/active
          example: true
        merchant_name:
          type: string
          description: Name of the merchant organizing the event
          example: "Event Organizers PLC"
        merchant_phone:
          type: string
          description: Contact phone number of the merchant
          example: "+251911223344"
        ticket_types:
          type: array
          items:
            $ref: '#/components/schemas/TicketTypeResponse'
    
    TicketTypeResponse:
      type: object
      properties:
        ticket_name:
          type: string
          description: Name/type of the ticket
          example: "VIP"
        ticket_price:
          type: integer
          description: Price of the ticket in ETB
          example: 1000
        ticket_count:
          type: integer
          description: Number of tickets available for this type
          example: 100
    
    EventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/EventResponse'
            - $ref: '#/components/schemas/EventListResponse'
            - type: object
              properties: {}
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_BAD_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: Events
    description: Operations related to event management

paths:
  /events:
    get:
      tags:
        - Events
      summary: Get all events
      description: |
        Retrieve a paginated list of all events.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Events retrieved successfully"
                data:
                  items:
                    - event_id: "507f1f77bcf86cd799439011"
                      event_code: "EVT-2023-001"
                      event_name: "Annual Music Festival"
                      event_description: "Join us for a night of amazing music and performances from top artists."
                      total_ticket_count: 1000
                      event_startdate: "2023-12-31T20:00:00Z"
                      event_enddate: "2024-01-01T06:00:00Z"
                      event_status: "upcoming"
                      event_venue: "Millennium Hall"
                      event_city: "Addis Ababa"
                      enabled: true
                      merchant_name: "Event Organizers PLC"
                      merchant_phone: "+251911223344"
                      cover_image: "https://example.com/events/cover.jpg"
                      ticket_types:
                        - ticket_name: "VIP"
                          ticket_price: 1000
                          ticket_count: 100
                        - ticket_name: "Regular"
                          ticket_price: 500
                          ticket_count: 900
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - Events
      summary: Create a new event
      description: |
        Create a new event with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event created successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /events/{id}:
    get:
      tags:
        - Events
      summary: Get event by ID
      description: |
        Retrieve detailed information about a specific event by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the event to retrieve
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Event details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event retrieved successfully"
                data:
                  event_id: "507f1f77bcf86cd799439011"
                  event_code: "EVT-2023-001"
                  event_name: "Annual Music Festival"
                  event_description: "Join us for a night of amazing music and performances from top artists."
                  total_ticket_count: 1000
                  event_startdate: "2023-12-31T20:00:00Z"
                  event_enddate: "2024-01-01T06:00:00Z"
                  event_status: "upcoming"
                  event_venue: "Millennium Hall"
                  event_city: "Addis Ababa"
                  enabled: true
                  merchant_name: "Event Organizers PLC"
                  merchant_phone: "+251911223344"
                  cover_image: "https://example.com/events/cover.jpg"
                  ticket_types:
                    - ticket_name: "VIP"
                      ticket_price: 1000
                      ticket_count: 100
                    - ticket_name: "Regular"
                      ticket_price: 500
                      ticket_count: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Events
      summary: Update an event
      description: |
        Update an existing event with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the event to update
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                account_number:
                  type: string
                  description: Bank account number for the event
                  example: "1000000000001"
                merchant_id:
                  type: string
                  description: ID of the merchant organizing the event
                  example: "507f1f77bcf86cd799439011"
                merchant_name:
                  type: string
                  description: Name of the merchant organizing the event
                  example: "Event Organizers PLC"
                merchant_phone_number:
                  type: string
                  description: Contact phone number of the merchant
                  example: "+251911223344"
                merchant_email:
                  type: string
                  format: email
                  description: Contact email of the merchant
                  example: "organizer@example.com"
                event_name:
                  type: string
                  description: Name of the event
                  example: "Annual Music Festival Updated"
                event_venue:
                  type: string
                  description: Venue where the event will take place
                  example: "Millennium Hall"
                event_city:
                  type: string
                  description: City where the event will take place
                  example: "Addis Ababa"
                start_date:
                  type: string
                  format: date-time
                  description: Start date and time of the event
                  example: "2023-12-31T20:00:00Z"
                due_date:
                  type: string
                  format: date-time
                  description: End date and time of the event
                  example: "2024-01-01T06:00:00Z"
                cover_image:
                  type: string
                  format: binary
                  description: New cover image for the event
                event_description:
                  type: string
                  description: Detailed description of the event
                  example: "Join us for a night of amazing music and performances from top artists. Updated description."
                total_ticket_count:
                  type: integer
                  minimum: 1
                  description: Total number of tickets available for the event
                  example: 1200
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event updated successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Events
      summary: Delete an event
      description: |
        Delete an existing event by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the event to delete
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Event deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event deleted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /events/{id}/enable:
    post:
      tags:
        - Events
      summary: Enable an event
      description: |
        Enable an existing event by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the event to enable
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Event enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event enabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /events/{id}/disable:
    post:
      tags:
        - Events
      summary: Disable an event
      description: |
        Disable an existing event by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the event to disable
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Event disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Event disabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested event does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
