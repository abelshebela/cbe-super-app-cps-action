openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Mini App Management API
  description: |
    This API provides endpoints for managing mini apps in the CBE Super App CPS Action module.
    It allows creating, updating, deleting, and retrieving mini apps.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    EnvironmentType:
      type: string
      enum: ["UAT", "DEV", "TEST", "PRODUCTION"]
      example: "PRODUCTION"
    
    BranchType:
      type: string
      enum: ["IFB", "CB"]
      example: "IFB"
    
    AppType:
      type: string
      enum: ["INTERNAL", "EXTERNAL"]
      example: "EXTERNAL"
    
    Stage:
      type: string
      enum: ["DRAFT", "PUBLISHED", "ARCHIVED"]
      example: "PUBLISHED"
    
    AppViewType:
      type: string
      enum: ["FULL_SCREEN", "POPUP"]
      example: "FULL_SCREEN"
    
    ProductCode:
      type: object
      properties:
        branch:
          $ref: '#/components/schemas/BranchType'
        product_code:
          type: string
          example: "PROD123"
        vat_code:
          type: string
          example: "VAT123"
        service_fee_code:
          type: string
          example: "SVC123"
    
    CredentialInformation:
      type: object
      properties:
        username:
          type: string
          example: "api_user"
        password:
          type: string
          format: password
          example: "secure_password"
        api_key:
          type: string
          example: "api_key_123456"
    
    MiniAppRequest:
      type: object
      required:
        - app_name
        - merchant_id
        - app_icon
        - banner_image
        - app_view_type
        - url
      properties:
        app_name:
          type: string
          description: Name of the mini app
          example: "Food Delivery App"
        app_icon:
          type: string
          format: binary
          description: Icon image file for the mini app (JPEG, PNG, GIF, max 2MB)
        banner_image:
          type: string
          format: binary
          description: Banner image file for the mini app (JPEG, PNG, GIF, max 2MB)
        commission_gl_account:
          type: string
          description: GL account for commissions
          example: "1234567890"
        merchant_id:
          type: string
          description: ID of the merchant associated with the mini app
          example: "merch_123456"
        is_event_mini_app:
          type: boolean
          description: Whether this is an event mini app
          default: false
        is_three_click:
          type: boolean
          description: Whether to enable three-click functionality
          default: false
        app_view_type:
          $ref: '#/components/schemas/AppViewType'
        url:
          type: string
          format: uri
          description: URL of the mini app
          example: "https://example.com/mini-app"
        ifb_product_code:
          type: string
          description: Product code for IFB
          example: "IFB123"
        ifb_vat_code:
          type: string
          description: VAT code for IFB
          example: "VAT123"
        ifb_service_fee_code:
          type: string
          description: Service fee code for IFB
          example: "SVC123"
        cb_product_code:
          type: string
          description: Product code for CB
          example: "CB123"
        cb_vat_code:
          type: string
          description: VAT code for CB
          example: "VAT456"
        cb_service_fee_code:
          type: string
          description: Service fee code for CB
          example: "SVC456"
    
    MiniAppResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the mini app
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
        app_name:
          type: string
          description: Name of the mini app
          example: "Food Delivery App"
        app_icon:
          type: string
          description: URL to the app icon
          example: "https://example.com/icons/app_icon.png"
        banner_image:
          type: string
          description: URL to the banner image
          example: "https://example.com/banners/banner.png"
        commission_gl_account:
          type: string
          description: GL account for commissions
          example: "1234567890"
        app_type:
          $ref: '#/components/schemas/AppType'
        merchant_id:
          type: string
          description: ID of the merchant associated with the mini app
          example: "merch_123456"
        app_view_type:
          $ref: '#/components/schemas/AppViewType'
        url:
          type: string
          description: URL of the mini app
          example: "https://example.com/mini-app"
        stage:
          $ref: '#/components/schemas/Stage'
        product_code:
          type: array
          items:
            $ref: '#/components/schemas/ProductCode'
        credential:
          $ref: '#/components/schemas/CredentialInformation'
        is_event_mini_app:
          type: boolean
          description: Whether this is an event mini app
          example: false
        is_three_click:
          type: boolean
          description: Whether three-click functionality is enabled
          example: false
        enabled:
          type: boolean
          description: Whether the mini app is enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: When the mini app was created
          example: "2023-01-01T12:00:00Z"
        last_modified_at:
          type: string
          format: date-time
          description: When the mini app was last modified
          example: "2023-01-01T12:00:00Z"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/MiniAppResponse'
            - type: array
              items:
                $ref: '#/components/schemas/MiniAppResponse'
            - type: object
              properties: {}
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: Mini App
    description: Operations related to mini app management

paths:
  /mini-apps:
    post:
      tags:
        - Mini App
      summary: Create a new mini app
      description: |
        Create a new mini app with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MiniAppRequest'
      responses:
        '200':
          description: Mini app created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app created successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    get:
      tags:
        - Mini App
      summary: List all mini apps
      description: |
        Retrieve a paginated list of all mini apps.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mini apps retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini apps retrieved successfully"
                data:
                  items:
                    - id: "60d5f1f9e6b3f3b3f3b3f3b3"
                      app_name: "Food Delivery App"
                      app_icon: "https://example.com/icons/app_icon.png"
                      banner_image: "https://example.com/banners/banner.png"
                      app_type: "EXTERNAL"
                      merchant_id: "merch_123456"
                      app_view_type: "FULL_SCREEN"
                      url: "https://example.com/mini-app"
                      stage: "PUBLISHED"
                      is_event_mini_app: false
                      is_three_click: false
                      enabled: true
                      created_at: "2023-01-01T12:00:00Z"
                      last_modified_at: "2023-01-01T12:00:00Z"
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /mini-apps/{id}:
    get:
      tags:
        - Mini App
      summary: Get mini app by ID
      description: |
        Retrieve detailed information about a specific mini app by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the mini app to retrieve
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Mini app details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app retrieved successfully"
                data:
                  id: "60d5f1f9e6b3f3b3f3b3f3b3"
                  app_name: "Food Delivery App"
                  app_icon: "https://example.com/icons/app_icon.png"
                  banner_image: "https://example.com/banners/banner.png"
                  app_type: "EXTERNAL"
                  merchant_id: "merch_123456"
                  app_view_type: "FULL_SCREEN"
                  url: "https://example.com/mini-app"
                  stage: "PUBLISHED"
                  is_event_mini_app: false
                  is_three_click: false
                  enabled: true
                  created_at: "2023-01-01T12:00:00Z"
                  last_modified_at: "2023-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Mini App
      summary: Update a mini app
      description: |
        Update an existing mini app with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the mini app to update
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MiniAppRequest'
      responses:
        '200':
          description: Mini app updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app updated successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Mini App
      summary: Delete a mini app
      description: |
        Delete a mini app by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the mini app to delete
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Mini app deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app deleted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /mini-apps/{id}/enable:
    post:
      tags:
        - Mini App
      summary: Enable a mini app
      description: |
        Enable a mini app by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the mini app to enable
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Mini app enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app enabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /mini-apps/{id}/disable:
    post:
      tags:
        - Mini App
      summary: Disable a mini app
      description: |
        Disable a mini app by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the mini app to disable
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Mini app disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Mini app disabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested mini app does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
