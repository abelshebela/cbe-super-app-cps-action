openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Portal Cards API
  description: |
    This API provides endpoints for managing portal cards in the CBE Super App CPS Action module.
    It allows retrieving portal cards with pagination.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Card:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the card
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
        card_name:
          type: string
          description: Name of the card
          example: "Dashboard"
        sub_cards:
          type: array
          description: List of sub-card names
          items:
            type: string
          example: ["Overview", "Analytics"]
    
    PaginatedCardResponse:
      type: object
      properties:
        items:
          type: array
          description: List of cards
          items:
            $ref: '#/components/schemas/Card'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 1
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 1
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          $ref: '#/components/schemas/PaginatedCardResponse'
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: Portal Cards
    description: Operations related to portal card management

paths:
  /portal-cards:
    get:
      tags:
        - Portal Cards
      summary: Get all portal cards
      description: |
        Retrieve a paginated list of all portal cards with their sub-cards.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Portal cards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Portal cards retrieved successfully"
                data:
                  items:
                    - id: "60d5f1f9e6b3f3b3f3b3f3b3"
                      card_name: "Dashboard"
                      sub_cards: ["Overview", "Analytics"]
                    - id: "60d5f1f9e6b3f3b3f3b3f3b4"
                      card_name: "Transactions"
                      sub_cards: ["History", "Pending"]
                  meta:
                    total: 2
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
