openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Donation Management API
  description: |
    This API provides endpoints for managing donations in the CBE Super App CPS Action module.
    It allows creating, updating, retrieving, and managing donations along with their images.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DonationImage:
      type: object
      properties:
        id: { type: string, example: "507f1f77bcf86cd799439011" }
        photo_url: { type: string, format: uri, example: "https://example.com/images/donation1.jpg" }
        created_at: { type: string, format: date-time, example: "2023-01-01T00:00:00Z" }
    
    Company:
      type: object
      properties:
        id: { type: string, example: "507f1f77bcf86cd799439011" }
        company_name: { type: string, example: "Charity Foundation" }
        company_logo: { type: string, format: uri, example: "https://example.com/logos/charity.jpg" }
        account_number: { type: string, example: "1000000000001" }
    
    Category:
      type: object
      properties:
        id: { type: string, example: "507f1f77bcf86cd799439012" }
        category_name: { type: string, example: "Education" }
        icon: { type: string, format: uri, example: "https://example.com/icons/education.png" }
    
    DonationRequest:
      type: object
      required: ["company_id", "category_id", "title", "target", "donation_description", "end_date", "start_date"]
      properties:
        company_id: { type: string, example: "507f1f77bcf86cd799439011" }
        category_id: { type: string, example: "507f1f77bcf86cd799439012" }
        title: { type: string, example: "Build a School for Children" }
        is_featured: { type: boolean, example: true }
        target: { type: integer, format: int32, example: 1000000 }
        donation_description: { type: string, example: "Help us build a school for underprivileged children." }
        end_date: { type: string, format: date-time, example: "2023-12-31T23:59:59Z" }
        start_date: { type: string, format: date-time, example: "2023-01-01T00:00:00Z" }
    
    DonationResponse:
      type: object
      properties:
        id: { type: string, example: "507f1f77bcf86cd799439013" }
        donation_code: { type: string, example: "DON-12345" }
        company: { $ref: '#/components/schemas/Company' }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string, example: "Build a School for Children" }
        is_featured: { type: boolean, example: true }
        target: { type: integer, format: int32, example: 1000000 }
        donation_description: { type: string, example: "Help us build a school for underprivileged children." }
        donation_images: { type: array, items: { $ref: '#/components/schemas/DonationImage' } }
        cover_image: { type: string, format: uri, example: "https://example.com/covers/school.jpg" }
        start_date: { type: string, format: date-time, example: "2023-01-01T00:00:00Z" }
        end_date: { type: string, format: date-time, example: "2023-12-31T23:59:59Z" }
        enabled: { type: boolean, example: true }
        is_deleted: { type: boolean, example: false }
        created_at: { type: string, format: date-time, example: "2023-01-01T00:00:00Z" }
        last_modified_at: { type: string, format: date-time, example: "2023-01-01T12:30:00Z" }
    
    PaginatedResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DonationResponse' } }
        meta:
          type: object
          properties:
            total: { type: integer, example: 100 }
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 10 }
            total_pages: { type: integer, example: 10 }
    
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: "ERR_BAD_REQUEST" }
            message: { type: string, example: "Invalid request parameters" }

security:
  - BearerAuth: []

tags:
  - name: Donations
    description: Operations related to donation management

paths:
  /donations:
    get:
      tags: ["Donations"]
      summary: Get all donations
      description: Retrieve a paginated list of all donations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A list of donations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags: ["Donations"]
      summary: Create a new donation
      description: Create a new donation with the provided details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ["company_id", "category_id", "title", "target", "donation_description", "end_date", "start_date"]
              properties:
                company_id: { type: string }
                category_id: { type: string }
                title: { type: string }
                is_featured: { type: boolean, default: false }
                target: { type: integer, format: int32, minimum: 1 }
                donation_description: { type: string }
                end_date: { type: string, format: date-time }
                start_date: { type: string, format: date-time }
                donation_images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Upload donation images (multiple files allowed)
                cover_image:
                  type: string
                  format: binary
                  description: Upload cover image (single file)
      responses:
        '200':
          description: Donation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /donations/{id}:
    get:
      tags: ["Donations"]
      summary: Get donation by ID
      description: Retrieve detailed information about a specific donation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Donation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags: ["Donations"]
      summary: Update a donation
      description: Update an existing donation with the provided details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company_id: { type: string }
                category_id: { type: string }
                title: { type: string }
                is_featured: { type: boolean }
                target: { type: integer, format: int32, minimum: 1 }
                donation_description: { type: string }
                end_date: { type: string, format: date-time }
                start_date: { type: string, format: date-time }
      responses:
        '200':
          description: Donation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /donations/{id}/enable:
    post:
      tags: ["Donations"]
      summary: Enable a donation
      description: Enable a disabled donation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Donation enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /donations/{id}/disable:
    post:
      tags: ["Donations"]
      summary: Disable a donation
      description: Disable an enabled donation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Donation disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /donations/{id}/images:
    post:
      tags: ["Donations"]
      summary: Add images to a donation
      description: Add one or more images to an existing donation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ["images"]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Images to upload (multiple files allowed)
      responses:
        '200':
          description: Images added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags: ["Donations"]
      summary: Delete an image from a donation
      description: Delete a specific image from a donation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["image_id"]
              properties:
                image_id: { type: string }
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested donation does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
