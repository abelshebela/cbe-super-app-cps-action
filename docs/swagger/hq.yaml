openapi: 3.0.3
info:
  title: CBE Super App CPS Action - HQ Management API
  description: |
    This API provides endpoints for managing HQ configurations in the CBE Super App CPS Action module.
    It allows retrieving and updating various HQ settings like block time, archive time, and password expiry.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    HQ:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the HQ
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          description: Name of the HQ
          example: "Main HQ"
        block_time:
          type: integer
          description: Block time setting in minutes
          example: 30
        archive_time:
          type: integer
          description: Archive time setting in days
          example: 90
        created_at:
          type: string
          format: date-time
          description: When the HQ was created
          example: "2023-01-01T12:00:00Z"
        last_modified_at:
          type: string
          format: date-time
          description: When the HQ was last modified
          example: "2023-01-01T12:00:00Z"
    
    BlockTimeResponse:
      type: object
      properties:
        block_time:
          type: integer
          description: Current block time setting in minutes
          example: 30
        created_at_block:
          type: string
          format: date-time
          description: When the block time was first set
          example: "2023-01-01T12:00:00Z"
        updated_at_block:
          type: string
          format: date-time
          description: When the block time was last updated
          example: "2023-01-01T12:00:00Z"
    
    ArchiveTimeResponse:
      type: object
      properties:
        archive_time:
          type: integer
          description: Current archive time setting in days
          example: 90
        created_at_archive:
          type: string
          format: date-time
          description: When the archive time was first set
          example: "2023-01-01T12:00:00Z"
        updated_at_archive:
          type: string
          format: date-time
          description: When the archive time was last updated
          example: "2023-01-01T12:00:00Z"
    
    PasswordExpiryResponse:
      type: object
      properties:
        password_expiry:
          type: integer
          description: Current password expiry setting in days
          example: 90
        created_at_password_expiry:
          type: string
          format: date-time
          description: When the password expiry was first set
          example: "2023-01-01T12:00:00Z"
        updated_at_password_expiry:
          type: string
          format: date-time
          description: When the password expiry was last updated
          example: "2023-01-01T12:00:00Z"
    
    UpdateBlockTimeRequest:
      type: object
      required:
        - block_time
      properties:
        block_time:
          type: integer
          minimum: 1
          description: New block time in minutes
          example: 30
    
    UpdateArchiveTimeRequest:
      type: object
      required:
        - archive_time
      properties:
        archive_time:
          type: integer
          minimum: 1
          description: New archive time in days
          example: 90
    
    UpdatePasswordExpiryRequest:
      type: object
      required:
        - password_expiry
      properties:
        password_expiry:
          type: integer
          minimum: 1
          description: New password expiry in days
          example: 90
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/HQ'
            - $ref: '#/components/schemas/BlockTimeResponse'
            - $ref: '#/components/schemas/ArchiveTimeResponse'
            - $ref: '#/components/schemas/PasswordExpiryResponse'
            - type: array
              items:
                $ref: '#/components/schemas/HQ'
            - type: object
              properties: {}
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: HQ Management
    description: Operations related to HQ configuration management

paths:
  /hq:
    get:
      tags:
        - HQ Management
      summary: Get all HQs
      description: |
        Retrieve a paginated list of all HQs with their configurations.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: HQs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "HQs retrieved successfully"
                data:
                  items:
                    - id: "507f1f77bcf86cd799439011"
                      name: "Main HQ"
                      block_time: 30
                      archive_time: 90
                      created_at: "2023-01-01T12:00:00Z"
                      last_modified_at: "2023-01-01T12:00:00Z"
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /hq/{id}:
    get:
      tags:
        - HQ Management
      summary: Get HQ by ID
      description: |
        Retrieve detailed information about a specific HQ by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the HQ to retrieve
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: HQ details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "HQ retrieved successfully"
                data:
                  id: "507f1f77bcf86cd799439011"
                  name: "Main HQ"
                  block_time: 30
                  archive_time: 90
                  created_at: "2023-01-01T12:00:00Z"
                  last_modified_at: "2023-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /hq/block-time:
    get:
      tags:
        - HQ Management
      summary: Get block time setting
      description: |
        Retrieve the current block time setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Block time setting retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Block time setting retrieved successfully"
                data:
                  block_time: 30
                  created_at_block: "2023-01-01T12:00:00Z"
                  updated_at_block: "2023-01-01T12:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - HQ Management
      summary: Update block time setting
      description: |
        Update the block time setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlockTimeRequest'
      responses:
        '200':
          description: Block time update request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Block time update request submitted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /hq/archive-time:
    get:
      tags:
        - HQ Management
      summary: Get archive time setting
      description: |
        Retrieve the current archive time setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Archive time setting retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Archive time setting retrieved successfully"
                data:
                  archive_time: 90
                  created_at_archive: "2023-01-01T12:00:00Z"
                  updated_at_archive: "2023-01-01T12:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - HQ Management
      summary: Update archive time setting
      description: |
        Update the archive time setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArchiveTimeRequest'
      responses:
        '200':
          description: Archive time update request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Archive time update request submitted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /hq/password-expiry:
    get:
      tags:
        - HQ Management
      summary: Get password expiry setting
      description: |
        Retrieve the current password expiry setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password expiry setting retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Password expiry setting retrieved successfully"
                data:
                  password_expiry: 90
                  created_at_password_expiry: "2023-01-01T12:00:00Z"
                  updated_at_password_expiry: "2023-01-01T12:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - HQ Management
      summary: Update password expiry setting
      description: |
        Update the password expiry setting.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordExpiryRequest'
      responses:
        '200':
          description: Password expiry update request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Password expiry update request submitted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested HQ does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
