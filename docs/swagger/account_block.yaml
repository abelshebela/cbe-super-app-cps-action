openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Account Block API
  description: |
    This API provides endpoints for managing branches, regions, districts, and cities in the CBE Super App CPS Action module.
    It allows retrieving location information and enabling/disabling locations.
  version: 1.0.0

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Request Schemas
    EnableOrDisableBranchesRequest:
      type: object
      required:
        - branches_code
      properties:
        branches_code:
          type: array
          items:
            type: string
          description: List of branch codes to enable/disable
          example: ["BR001", "BR002"]
    
    EnableOrDisableRegionsRequest:
      type: object
      required:
        - regions_code
      properties:
        regions_code:
          type: array
          items:
            type: string
          description: List of region codes to enable/disable
          example: ["REG001", "REG002"]
    
    EnableOrDisableDistrictsRequest:
      type: object
      required:
        - districts_code
      properties:
        districts_code:
          type: array
          items:
            type: string
          description: List of district codes to enable/disable
          example: ["DIST001", "DIST002"]
    
    EnableOrDisableCitiesRequest:
      type: object
      required:
        - city_code
      properties:
        city_code:
          type: array
          items:
            type: string
          description: List of city codes to enable/disable
          example: ["CITY001", "CITY002"]
    
    # Response Schemas
    BranchResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the branch
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        branch_code:
          type: string
          description: Branch code
          example: BR001
        branch_name:
          type: string
          description: Name of the branch
          example: Main Branch
        branch_address:
          type: string
          description: Physical address of the branch
          example: Bole Road, Addis Ababa
        district_code:
          type: string
          description: Code of the district where the branch is located
          example: DIST001
        district_name:
          type: string
          description: Name of the district where the branch is located
          example: Bole
        branch_region:
          type: string
          description: Region where the branch is located
          example: Addis Ababa
        record_stat:
          type: string
          description: Record status
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the branch is enabled
          example: true
    
    RegionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the region
          example: 5f9d7b3b9d5f3b2a1c9d5f3e
        region_code:
          type: string
          description: Region code
          example: REG001
        region_name:
          type: string
          description: Name of the region
          example: Addis Ababa
        region_address:
          type: string
          description: Address of the regional office
          example: Addis Ababa, Ethiopia
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the region is enabled
          example: true
    
    DistrictResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the district
          example: 5f9d7b3b9d5f3b2a1c9d5f3f
        district_code:
          type: string
          description: District code
          example: DIST001
        district_name:
          type: string
          description: Name of the district
          example: Bole
        district_address:
          type: string
          description: Address of the district
          example: Bole, Addis Ababa
        region_id:
          type: string
          description: ID of the region this district belongs to
          example: 5f9d7b3b9d5f3b2a1c9d5f3e
        region_name:
          type: string
          description: Name of the region this district belongs to
          example: Addis Ababa
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the district is enabled
          example: true
    
    CityResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the city
          example: 5f9d7b3b9d5f3b2a1c9d5f40
        city_code:
          type: string
          description: City code
          example: CITY001
        city_name:
          type: string
          description: Name of the city
          example: Addis Ababa
        city_address:
          type: string
          description: Address in the city
          example: Addis Ababa, Ethiopia
        district_id:
          type: string
          description: ID of the district this city belongs to
          example: 5f9d7b3b9d5f3b2a1c9d5f3f
        district_name:
          type: string
          description: Name of the district this city belongs to
          example: Bole
        region_id:
          type: string
          description: ID of the region this city belongs to
          example: 5f9d7b3b9d5f3b2a1c9d5f3e
        region_name:
          type: string
          description: Name of the region this city belongs to
          example: Addis Ababa
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        enabled:
          type: boolean
          description: Whether the city is enabled
          example: true
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10
  
  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []

tags:
  - name: Account Block
    description: Account block management operations

paths:
  /account_block/branches:
    get:
      tags:
        - Account Block
      summary: Get all branches
      description: Retrieve a paginated list of all branches
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of branches retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Branches retrieved successfully
                data:
                  items:
                    - id: 5f9d7b3b9d5f3b2a1c9d5f3d
                      branch_code: BR001
                      branch_name: Main Branch
                      branch_address: Bole Road, Addis Ababa
                      district_code: DIST001
                      district_name: Bole
                      branch_region: Addis Ababa
                      record_stat: ACTIVE
                      created_at: '2023-10-01T10:00:00Z'
                      updated_at: '2023-10-01T10:00:00Z'
                      enabled: true
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_block/branches/{branch_code}:
    get:
      tags:
        - Account Block
      summary: Get branch by code
      description: Retrieve detailed information about a specific branch
      security:
        - BearerAuth: []
      parameters:
        - name: branch_code
          in: path
          required: true
          description: Branch code
          schema:
            type: string
      responses:
        '200':
          description: Branch details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Branch retrieved successfully
                data:
                  id: 5f9d7b3b9d5f3b2a1c9d5f3d
                  branch_code: BR001
                  branch_name: Main Branch
                  branch_address: Bole Road, Addis Ababa
                  district_code: DIST001
                  district_name: Bole
                  branch_region: Addis Ababa
                  record_stat: ACTIVE
                  created_at: '2023-10-01T10:00:00Z'
                  updated_at: '2023-10-01T10:00:00Z'
                  enabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_block/branches/enable:
    post:
      tags:
        - Account Block
      summary: Enable branches
      description: Enable one or more branches by their codes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableOrDisableBranchesRequest'
      responses:
        '200':
          description: Branches enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Branches enabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_block/branches/disable:
    post:
      tags:
        - Account Block
      summary: Disable branches
      description: Disable one or more branches by their codes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableOrDisableBranchesRequest'
      responses:
        '200':
          description: Branches disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Branches disabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  # Similar endpoints for regions, districts, and cities follow the same pattern
  # I've included the full structure for branches as an example
  
  /account_block/regions:
    get:
      tags:
        - Account Block
      summary: Get all regions
      description: Retrieve a paginated list of all regions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of regions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_block/regions/{region_code}:
    get:
      tags:
        - Account Block
      summary: Get region by code
      description: Retrieve detailed information about a specific region
      security:
        - BearerAuth: []
      parameters:
        - name: region_code
          in: path
          required: true
          description: Region code
          schema:
            type: string
      responses:
        '200':
          description: Region details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  # Additional endpoints for regions, districts, and cities follow the same pattern
  # I've included the structure for regions as an example
  # Similar endpoints exist for districts and cities with their respective paths
  
  /account_block/districts:
    get:
      tags:
        - Account Block
      summary: Get all districts
      description: Retrieve a paginated list of all districts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of districts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  
  /account_block/districts/{district_code}:
    get:
      tags:
        - Account Block
      summary: Get district by code
      description: Retrieve detailed information about a specific district
      security:
        - BearerAuth: []
      parameters:
        - name: district_code
          in: path
          required: true
          description: District code
          schema:
            type: string
      responses:
        '200':
          description: District details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  
  /account_block/city:
    get:
      tags:
        - Account Block
      summary: Get all cities
      description: Retrieve a paginated list of all cities
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of cities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  
  /account_block/city/{city_code}:
    get:
      tags:
        - Account Block
      summary: Get city by code
      description: Retrieve detailed information about a specific city
      security:
        - BearerAuth: []
      parameters:
        - name: city_code
          in: path
          required: true
          description: City code
          schema:
            type: string
      responses:
        '200':
          description: City details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
