openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Bulk Service Management API
  description: |
    This API provides endpoints for managing bulk services in the CBE Super App CPS Action module.
    It allows retrieving all bulk services and enabling/disabling them in bulk.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Request/Response Schemas
    BulkServiceDTO:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: string
            description: List of service keys to perform bulk operations on
          example: ["SERVICE1", "SERVICE2", "SERVICE3"]
    
    BulkServiceResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the bulk service
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        key:
          type: string
          description: Unique key identifying the service
          example: "BULK_PAYMENT"
        name:
          type: string
          description: Display name of the service
          example: "Bulk Payment Service"
        description:
          type: string
          description: Detailed description of the service
          example: "Service for processing multiple payments in a single batch"
        enabled:
          type: boolean
          description: Whether the service is currently enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: When the service was created
          example: "2023-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the service was last updated
          example: "2023-09-01T15:30:00Z"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BulkServiceResponse'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: Bulk Service Management
    description: Operations related to bulk service management

paths:
  /bulk-services:
    get:
      tags:
        - Bulk Service Management
      summary: Get all bulk services
      description: Retrieve a paginated list of all available bulk services
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of bulk services retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bulk services retrieved successfully
                data:
                  items:
                    - id: 5f9d7b3b9d5f3b2a1c9d5f3d
                      key: "BULK_PAYMENT"
                      name: "Bulk Payment Service"
                      description: "Service for processing multiple payments in a single batch"
                      enabled: true
                      created_at: "2023-01-01T00:00:00Z"
                      updated_at: "2023-09-01T15:30:00Z"
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /bulk-services/enable:
    post:
      tags:
        - Bulk Service Management
      summary: Enable bulk services
      description: Enable multiple bulk services by their keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkServiceDTO'
      responses:
        '200':
          description: Bulk services enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bulk services enabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /bulk-services/disable:
    post:
      tags:
        - Bulk Service Management
      summary: Disable bulk services
      description: Disable multiple bulk services by their keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkServiceDTO'
      responses:
        '200':
          description: Bulk services disable request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bulk services disable request submitted successfully
                data:
                  action_code: "ACT-12345"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
