openapi: 3.0.3
info:
  title: CBE Super App CPS Action - BPS User Management API
  description: |
    This API provides endpoints for managing BPS (Banking Platform System) users in the CBE Super App CPS Action module.
    It allows retrieving user information and managing user status (enable/disable).
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Response Schemas
    BPSUser:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the BPS user
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        user_code:
          type: string
          description: Unique code identifying the BPS user
          example: BPS12345
        full_name:
          type: string
          description: Full name of the BPS user
          example: John Doe
        username:
          type: string
          description: Username for authentication
          example: johndoe
        phone_number:
          type: string
          description: Contact phone number
          example: +251911223344
        branch_code:
          type: array
          items:
            type: string
          description: List of branch codes the user has access to
          example: ["BR001", "BR002"]
        branch_name:
          type: string
          description: Name of the user's primary branch
          example: Addis Ababa Main Branch
        home_branch:
          type: string
          description: User's home branch code
          example: BR001
        role:
          type: string
          description: User role (maker, checker, auditor)
          example: maker
        enabled:
          type: boolean
          description: Whether the user account is enabled
          example: true
        is_deleted:
          type: boolean
          description: Whether the user account is marked as deleted
          example: false
        last_login:
          type: string
          format: date-time
          description: Timestamp of the user's last login
          example: 2023-10-01T10:00:00Z
        created_at:
          type: string
          format: date-time
          description: When the user account was created
          example: 2023-01-01T00:00:00Z
        last_modified_at:
          type: string
          format: date-time
          description: When the user account was last modified
          example: 2023-09-01T15:30:00Z
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BPSUser'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: BPS User Management
    description: Operations related to BPS user management

paths:
  /bps-users:
    get:
      tags:
        - BPS User Management
      summary: Get all BPS users
      description: Retrieve a paginated list of all BPS users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of BPS users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: BPS users retrieved successfully
                data:
                  items:
                    - id: 5f9d7b3b9d5f3b2a1c9d5f3d
                      user_code: BPS12345
                      full_name: John Doe
                      username: johndoe
                      phone_number: +251911223344
                      branch_code: ["BR001", "BR002"]
                      branch_name: Addis Ababa Main Branch
                      home_branch: BR001
                      role: maker
                      enabled: true
                      is_deleted: false
                      last_login: '2023-10-01T10:00:00Z'
                      created_at: '2023-01-01T00:00:00Z'
                      last_modified_at: '2023-09-01T15:30:00Z'
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /bps-users/{user_code}:
    get:
      tags:
        - BPS User Management
      summary: Get BPS user by user code
      description: Retrieve detailed information about a specific BPS user
      security:
        - BearerAuth: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: BPS user code
          schema:
            type: string
          example: BPS12345
      responses:
        '200':
          description: BPS user details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: BPS user retrieved successfully
                data:
                  id: 5f9d7b3b9d5f3b2a1c9d5f3d
                  user_code: BPS12345
                  full_name: John Doe
                  username: johndoe
                  phone_number: +251911223344
                  branch_code: ["BR001", "BR002"]
                  branch_name: Addis Ababa Main Branch
                  home_branch: BR001
                  role: maker
                  enabled: true
                  is_deleted: false
                  last_login: '2023-10-01T10:00:00Z'
                  created_at: '2023-01-01T00:00:00Z'
                  last_modified_at: '2023-09-01T15:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - BPS User Management
      summary: Enable BPS user
      description: Enable a disabled BPS user account
      security:
        - BearerAuth: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: BPS user code to enable
          schema:
            type: string
          example: BPS12345
      responses:
        '200':
          description: BPS user enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: BPS user enabled successfully
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - BPS User Management
      summary: Disable BPS user
      description: Disable an enabled BPS user account
      security:
        - BearerAuth: []
      parameters:
        - name: user_code
          in: path
          required: true
          description: BPS user code to disable
          schema:
            type: string
          example: BPS12345
      responses:
        '200':
          description: BPS user disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: BPS user disabled successfully
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
