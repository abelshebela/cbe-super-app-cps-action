openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Bank API
  description: |
    This API provides endpoints for managing banks in the CBE Super App CPS Action module.
    It allows creating, reading, updating, and deleting bank information, as well as enabling/disabling banks and managing their logos.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Bank:
      type: object
      required:
        - name
        - code
        - bic
      properties:
        _id:
          type: string
          description: Unique identifier for the bank
          example: 5f9d7b3b9d5f3b2a1c9d5f3b
        name:
          type: string
          description: Name of the bank
          example: Commercial Bank of Ethiopia
        logo:
          type: string
          description: URL to the bank's logo
          example: https://example.com/bank-logo.png
        code:
          type: string
          description: Bank code
          example: 1000
        bic:
          type: string
          description: Bank Identifier Code
          example: CBETETAA
        enabled:
          type: boolean
          description: Whether the bank is enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        last_modified_at:
          type: string
          format: date-time
          description: Last modification timestamp
    
    CreateBankRequest:
      type: object
      required:
        - name
        - code
        - bic
        - logo
      properties:
        name:
          type: string
          description: Name of the bank
          example: Commercial Bank of Ethiopia
        code:
          type: string
          description: Bank code
          example: 1000
        bic:
          type: string
          description: Bank Identifier Code
          example: CBETETAA
        logo:
          type: string
          format: binary
          description: Bank logo image file (JPEG, PNG, GIF, or WebP, max 2MB)
    
    UpdateBankRequest:
      type: object
      properties:
        _id:
          type: string
          description: Bank ID
          example: 5f9d7b3b9d5f3b2a1c9d5f3b
        name:
          type: string
          description: Name of the bank
          example: Commercial Bank of Ethiopia
        code:
          type: string
          description: Bank code
          example: 1000
        bic:
          type: string
          description: Bank Identifier Code
          example: CBETETAA
    
    UpdateLogoRequest:
      type: object
      required:
        - _id
        - logo
      properties:
        _id:
          type: string
          description: Bank ID
          example: 5f9d7b3b9d5f3b2a1c9d5f3b
        logo:
          type: string
          format: binary
          description: Bank logo image file (JPEG, PNG, GIF, or WebP, max 2MB)
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true

security:
  - BearerAuth: []

tags:
  - name: Banks
    description: Bank management operations

paths:
  /banks:
    get:
      tags:
        - Banks
      summary: Get all banks
      description: Retrieve a list of all banks with pagination support
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of banks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Banks retrieved successfully
                data:
                  items:
                    - _id: 5f9d7b3b9d5f3b2a1c9d5f3b
                      name: Commercial Bank of Ethiopia
                      logo: https://example.com/cbe-logo.png
                      code: '1000'
                      bic: CBETETAA
                      enabled: true
                      created_at: '2023-10-01T10:00:00Z'
                      last_modified_at: '2023-10-01T10:00:00Z'
                  total: 1
                  page: 1
                  limit: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - Banks
      summary: Create a new bank
      description: Create a new bank with the provided details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBankRequest'
      responses:
        '201':
          description: Bank created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank created successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3b
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /banks/{id}:
    get:
      tags:
        - Banks
      summary: Get a bank by ID
      description: Retrieve detailed information about a specific bank
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank retrieved successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3b
                  name: Commercial Bank of Ethiopia
                  logo: https://example.com/cbe-logo.png
                  code: '1000'
                  bic: CBETETAA
                  enabled: true
                  created_at: '2023-10-01T10:00:00Z'
                  last_modified_at: '2023-10-01T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    patch:
      tags:
        - Banks
      summary: Update a bank
      description: Update bank details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankRequest'
      responses:
        '200':
          description: Bank updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank updated successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3b
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Banks
      summary: Delete a bank
      description: Delete a bank by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank deleted successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /banks/{id}/enable:
    patch:
      tags:
        - Banks
      summary: Enable a bank
      description: Enable a previously disabled bank
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank enabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /banks/{id}/disable:
    patch:
      tags:
        - Banks
      summary: Disable a bank
      description: Disable a bank (soft delete)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      responses:
        '200':
          description: Bank disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank disabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /banks/{id}/logo:
    patch:
      tags:
        - Banks
      summary: Update bank logo
      description: Update the logo for a bank
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bank ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateLogoRequest'
      responses:
        '200':
          description: Bank logo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Bank logo updated successfully
                data:
                  url: https://example.com/new-logo.png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
