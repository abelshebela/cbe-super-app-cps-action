openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Account Validation API
  description: |
    This API provides endpoints for managing account validation rules in the CBE Super App CPS Action module.
    It allows retrieving, updating, and managing validation rules for different entity types.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Request/Response Schemas
    ValidationRuleDTO:
      type: object
      required:
        - identifier
      properties:
        id:
          type: string
          description: Unique identifier for the validation rule
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        entity_type:
          type: string
          description: Type of entity this validation rule applies to
          example: CUSTOMER
        validation_for:
          type: string
          description: What this validation rule is for
          example: PHONE_NUMBER
        identifier:
          type: string
          description: Unique identifier for the validation rule
          example: PHONE_NUMBER_VALIDATION
        min_length:
          type: integer
          format: uint8
          description: Minimum length for the validated field
          example: 10
        max_length:
          type: integer
          format: uint8
          description: Maximum length for the validated field
          example: 15
        enabled:
          type: boolean
          description: Whether the validation rule is enabled
          example: true
        is_deleted:
          type: boolean
          description: Whether the validation rule is marked as deleted
          example: false
        service_id:
          type: string
          description: ID of the service this validation rule belongs to
          example: 5f9d7b3b9d5f3b2a1c9d5f3e
    
    ValidationRule:
      allOf:
        - $ref: '#/components/schemas/ValidationRuleDTO'
      properties:
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        last_modified_at:
          type: string
          format: date-time
          description: Last modification timestamp
    
    ApproveRejectRequest:
      type: object
      required:
        - action_code
        - decison
      properties:
        action_code:
          type: string
          description: Code identifying the action
          example: ACT-12345
        decison:
          type: string
          enum: [APPROVED, DENIED]
          description: Decision to approve or reject
          example: APPROVED
        rejected_reason:
          type: string
          description: Required if decision is DENIED
          example: Insufficient documentation
    
    UpdateAccountValidationRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/ValidationRuleDTO'
    
    # Response Schemas
    GetAccountValidationResponse:
      type: object
      properties:
        validation:
          $ref: '#/components/schemas/ValidationRuleDTO'
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: Account Validation
    description: Account validation rules management

paths:
  /account_validation:
    get:
      tags:
        - Account Validation
      summary: Get all validation rules
      description: Retrieve a paginated list of all validation rules
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of validation rules retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Validation rules retrieved successfully
                data:
                  items:
                    - id: 5f9d7b3b9d5f3b2a1c9d5f3d
                      entity_type: CUSTOMER
                      validation_for: PHONE_NUMBER
                      identifier: PHONE_NUMBER_VALIDATION
                      min_length: 10
                      max_length: 15
                      enabled: true
                      is_deleted: false
                      service_id: 5f9d7b3b9d5f3b2a1c9d5f3e
                      created_at: '2023-10-01T10:00:00Z'
                      last_modified_at: '2023-10-01T10:00:00Z'
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_validation/{id}:
    get:
      tags:
        - Account Validation
      summary: Get validation rule by ID
      description: Retrieve detailed information about a specific validation rule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Validation rule ID
          schema:
            type: string
      responses:
        '200':
          description: Validation rule details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Validation rule retrieved successfully
                data:
                  id: 5f9d7b3b9d5f3b2a1c9d5f3d
                  entity_type: CUSTOMER
                  validation_for: PHONE_NUMBER
                  identifier: PHONE_NUMBER_VALIDATION
                  min_length: 10
                  max_length: 15
                  enabled: true
                  is_deleted: false
                  service_id: 5f9d7b3b9d5f3b2a1c9d5f3e
                  created_at: '2023-10-01T10:00:00Z'
                  last_modified_at: '2023-10-01T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Account Validation
      summary: Update validation rule
      description: Update an existing validation rule by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Validation rule ID to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountValidationRequest'
      responses:
        '200':
          description: Validation rule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Validation rule updated successfully
                data: null
        '400':
          description: |
            Bad Request. Possible error codes:
            - ERR_INVALID_REQUEST: Invalid request parameters
            - ERR_VALIDATION: Validation failed
            - ERR_VALIDATION_RULE_MIN_MAX_LENGTH: min_length cannot be greater than max_length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /account_validation/approve-reject:
    post:
      tags:
        - Account Validation
      summary: Approve or reject a validation rule change
      description: Approve or reject a pending validation rule change
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRejectRequest'
      responses:
        '200':
          description: Operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Validation rule change approved successfully
                data: null
        '400':
          description: |
            Bad Request. Possible error codes:
            - ERR_INVALID_REQUEST: Invalid request parameters
            - ERR_REJECTED_REASON_REQUIRED: Rejected reason is required when decision is DENIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
