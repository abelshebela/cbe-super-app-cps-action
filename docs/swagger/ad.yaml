openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Ad Management API
  description: |
    This API provides endpoints for managing advertisements in the CBE Super App CPS Action module.
    It allows creating, retrieving, updating, and deleting ads, as well as enabling/disabling them.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Request/Response Schemas
    AdvertRequest:
      type: object
      properties:
        id:
          type: string
          description: Advert ID (required for update, not for create)
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        title:
          type: string
          description: Title of the advertisement
          example: Special Offer
        description:
          type: string
          description: Detailed description of the advertisement
          example: Get 20% off on all services this week!
        banner_image:
          type: string
          format: binary
          description: Banner image file (JPEG, PNG)
        advert_for:
          type: string
          enum: [HOME, PROMOTION, NOTIFICATION, OTHER]
          description: Where the advert will be displayed
          example: HOME
        date:
          $ref: '#/components/schemas/AdvertDate'
    
    AdvertDate:
      type: object
      required:
        - started_at
        - expired_at
      properties:
        started_at:
          type: string
          format: date-time
          description: When the advert should start being displayed
          example: '2023-12-01T00:00:00Z'
        expired_at:
          type: string
          format: date-time
          description: When the advert should stop being displayed
          example: '2023-12-31T23:59:59Z'
    
    AdvertResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the advert
          example: 5f9d7b3b9d5f3b2a1c9d5f3d
        title:
          type: string
          description: Title of the advertisement
          example: Special Offer
        description:
          type: string
          description: Detailed description of the advertisement
          example: Get 20% off on all services this week!
        banner_image:
          type: string
          description: URL to the banner image
          example: https://example.com/banners/special-offer.jpg
        advert_for:
          type: string
          enum: [HOME, PROMOTION, NOTIFICATION, OTHER]
          description: Where the advert is displayed
          example: HOME
        date:
          $ref: '#/components/schemas/AdvertDate'
        enabled:
          type: boolean
          description: Whether the advert is currently active
          example: true
        created_at:
          type: string
          format: date-time
          description: When the advert was created
        last_updated_at:
          type: string
          format: date-time
          description: When the advert was last updated
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: Ad Management
    description: Advertisement management operations

paths:
  /ad:
    post:
      tags:
        - Ad Management
      summary: Create a new advertisement
      description: Create a new advertisement with the provided details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvertRequest'
      responses:
        '200':
          description: Advertisement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement created successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    get:
      tags:
        - Ad Management
      summary: List all advertisements
      description: Retrieve a paginated list of all advertisements
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of advertisements retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisements retrieved successfully
                data:
                  items:
                    - id: 5f9d7b3b9d5f3b2a1c9d5f3d
                      title: Special Offer
                      description: Get 20% off on all services this week!
                      banner_image: https://example.com/banners/special-offer.jpg
                      advert_for: HOME
                      date:
                        started_at: '2023-12-01T00:00:00Z'
                        expired_at: '2023-12-31T23:59:59Z'
                      enabled: true
                      created_at: '2023-11-15T10:00:00Z'
                      last_updated_at: '2023-11-15T10:00:00Z'
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /ad/{id}:
    get:
      tags:
        - Ad Management
      summary: Get advertisement by ID
      description: Retrieve detailed information about a specific advertisement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Advertisement ID
          schema:
            type: string
      responses:
        '200':
          description: Advertisement details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement retrieved successfully
                data:
                  id: 5f9d7b3b9d5f3b2a1c9d5f3d
                  title: Special Offer
                  description: Get 20% off on all services this week!
                  banner_image: https://example.com/banners/special-offer.jpg
                  advert_for: HOME
                  date:
                    started_at: '2023-12-01T00:00:00Z'
                    expired_at: '2023-12-31T23:59:59Z'
                  enabled: true
                  created_at: '2023-11-15T10:00:00Z'
                  last_updated_at: '2023-11-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Ad Management
      summary: Update advertisement
      description: Update an existing advertisement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Advertisement ID to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdvertRequest'
      responses:
        '200':
          description: Advertisement updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement updated successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Ad Management
      summary: Delete advertisement
      description: Delete an advertisement by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Advertisement ID to delete
          schema:
            type: string
      responses:
        '200':
          description: Advertisement deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement deleted successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /ad/{id}/enable:
    post:
      tags:
        - Ad Management
      summary: Enable advertisement
      description: Enable a disabled advertisement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Advertisement ID to enable
          schema:
            type: string
      responses:
        '200':
          description: Advertisement enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement enabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /ad/{id}/disable:
    post:
      tags:
        - Ad Management
      summary: Disable advertisement
      description: Disable an enabled advertisement
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Advertisement ID to disable
          schema:
            type: string
      responses:
        '200':
          description: Advertisement disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Advertisement disabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
