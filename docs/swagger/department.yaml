openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Department Management API
  description: |
    This API provides endpoints for managing departments in the CBE Super App CPS Action module.
    It allows creating, updating, retrieving, and managing the status of departments.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateDepartmentRequest:
      type: object
      required:
        - department
      properties:
        department:
          type: string
          description: Name of the department
          example: "Customer Service"
        portal_cards:
          type: array
          items:
            type: string
            format: ObjectId
          description: List of portal card IDs associated with the department
          example: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439012"]
        permission_groups:
          type: array
          items:
            type: string
            format: ObjectId
          description: List of permission group IDs associated with the department
          example: ["507f1f77bcf86cd799439013"]
    
    UpdateDepartmentRequest:
      type: object
      properties:
        department:
          type: string
          description: Updated name of the department
          example: "Customer Support"
        portal_cards:
          type: array
          items:
            type: string
            format: ObjectId
          description: Updated list of portal card IDs
          example: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439014"]
        permission_groups:
          type: array
          items:
            type: string
            format: ObjectId
          description: Updated list of permission group IDs
          example: ["507f1f77bcf86cd799439015"]
    
    DepartmentResponse:
      type: object
      properties:
        id:
          type: string
          format: ObjectId
          description: Unique identifier for the department
          example: "507f1f77bcf86cd799439011"
        department_code:
          type: string
          description: Auto-generated code for the department
          example: "DEPT-001"
        department:
          type: string
          description: Name of the department
          example: "Customer Service"
        portal_cards:
          type: array
          items:
            type: string
            format: ObjectId
          description: List of portal card IDs
          example: ["507f1f77bcf86cd799439011"]
        enabled:
          type: boolean
          description: Whether the department is enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: When the department was created
          example: "2023-01-01T00:00:00Z"
        last_modified:
          type: string
          format: date-time
          description: When the department was last modified
          example: "2023-01-01T12:30:00Z"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/DepartmentResponse'
            - $ref: '#/components/schemas/PaginatedResponse'
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_BAD_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"
    
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentResponse'
        meta:
          type: object
          properties:
            total:
              type: integer
              description: Total number of items
              example: 100
            page:
              type: integer
              description: Current page number
              example: 1
            limit:
              type: integer
              description: Number of items per page
              example: 10
            total_pages:
              type: integer
              description: Total number of pages
              example: 10

security:
  - BearerAuth: []

tags:
  - name: Departments
    description: Operations related to department management

paths:
  /departments:
    get:
      tags:
        - Departments
      summary: Get all departments
      description: |
        Retrieve a paginated list of all departments.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Departments retrieved successfully"
                data:
                  items:
                    - id: "507f1f77bcf86cd799439011"
                      department_code: "DEPT-001"
                      department: "Customer Service"
                      portal_cards: ["507f1f77bcf86cd799439011"]
                      enabled: true
                      created_at: "2023-01-01T00:00:00Z"
                      last_modified: "2023-01-01T12:30:00Z"
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - Departments
      summary: Create a new department
      description: |
        Create a new department with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '200':
          description: Department creation request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Department creation request submitted successfully"
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /departments/{id}:
    get:
      tags:
        - Departments
      summary: Get department by ID
      description: |
        Retrieve detailed information about a specific department by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the department to retrieve
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Department details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Department details retrieved successfully"
                data:
                  id: "507f1f77bcf86cd799439011"
                  department_code: "DEPT-001"
                  department: "Customer Service"
                  portal_cards: ["507f1f77bcf86cd799439011"]
                  enabled: true
                  created_at: "2023-01-01T00:00:00Z"
                  last_modified: "2023-01-01T12:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Departments
      summary: Update a department
      description: |
        Update an existing department with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the department to update
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Department update request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Department update request submitted successfully"
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /departments/{id}/enable:
    post:
      tags:
        - Departments
      summary: Enable a department
      description: |
        Enable a disabled department.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the department to enable
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Department enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Department enabled successfully"
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /departments/{id}/disable:
    post:
      tags:
        - Departments
      summary: Disable a department
      description: |
        Disable an enabled department.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the department to disable
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Department disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Department disabled successfully"
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested department does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
