openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Notifications API
  description: |
    This API provides endpoints for managing notifications in the CBE Super App CPS Action module.
    It allows creating, updating, deleting, enabling, disabling, and retrieving notifications.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    NotificationRequest:
      type: object
      required:
        - notification_type
        - notification_body
        - title
        - for
      properties:
        notification_type:
          type: string
          description: Type of the notification
          example: "SYSTEM_ALERT"
        notification_body:
          type: string
          description: Content of the notification
          example: "System maintenance scheduled for tomorrow at 2 AM"
        is_public:
          type: boolean
          description: Whether the notification is public
          example: true
        for:
          type: string
          enum: ["IFB", "CB", "ALL"]
          description: Target audience for the notification (IFB, CB, or ALL)
          example: "ALL"
        title:
          type: string
          description: Title of the notification
          example: "Scheduled Maintenance"
    
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the notification
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
        title:
          type: string
          description: Title of the notification
          example: "Scheduled Maintenance"
        notification_type:
          type: string
          description: Type of the notification
          example: "SYSTEM_ALERT"
        notification_body:
          type: string
          description: Content of the notification
          example: "System maintenance scheduled for tomorrow at 2 AM"
        is_public:
          type: boolean
          description: Whether the notification is public
          example: true
        for:
          type: string
          description: Target audience for the notification (IFB, CB, or ALL)
          example: "ALL"
        created_by:
          type: string
          description: ID of the user who created the notification
          example: "user123"
        notification_parts:
          type: object
          description: Additional notification parts or metadata
          nullable: true
        seen:
          type: boolean
          description: Whether the notification has been seen
          example: false
        enabled:
          type: boolean
          description: Whether the notification is enabled
          example: true
        status:
          type: string
          description: Status of the notification
          example: "ACTIVE"
        is_deleted:
          type: boolean
          description: Whether the notification is soft-deleted
          example: false
        created_at:
          type: string
          format: date-time
          description: When the notification was created
          example: "2023-01-01T12:00:00Z"
        last_modified:
          type: string
          format: date-time
          description: When the notification was last modified
          example: "2023-01-01T12:00:00Z"
        deleted_at:
          type: string
          format: date-time
          description: When the notification was deleted (if applicable)
          nullable: true
          example: null
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/NotificationResponse'
            - type: array
              items:
                $ref: '#/components/schemas/NotificationResponse'
            - type: object
              properties: {}
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: Notifications
    description: Operations related to notification management

paths:
  /notifications:
    post:
      tags:
        - Notifications
      summary: Create a new notification
      description: |
        Create a new notification with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notification created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification created successfully"
                data:
                  id: "60d5f1f9e6b3f3b3f3b3f3b3"
                  title: "Scheduled Maintenance"
                  notification_type: "SYSTEM_ALERT"
                  notification_body: "System maintenance scheduled for tomorrow at 2 AM"
                  is_public: true
                  for: "ALL"
                  created_by: "user123"
                  notification_parts: null
                  seen: false
                  enabled: true
                  status: "ACTIVE"
                  is_deleted: false
                  created_at: "2023-01-01T12:00:00Z"
                  last_modified: "2023-01-01T12:00:00Z"
                  deleted_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    get:
      tags:
        - Notifications
      summary: List all notifications with pagination
      description: |
        Retrieve a paginated list of all notifications.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notifications retrieved successfully"
                data:
                  items:
                    - id: "60d5f1f9e6b3f3b3f3b3f3b3"
                      title: "Scheduled Maintenance"
                      notification_type: "SYSTEM_ALERT"
                      notification_body: "System maintenance scheduled for tomorrow at 2 AM"
                      is_public: true
                      for: "ALL"
                      created_by: "user123"
                      notification_parts: null
                      seen: false
                      enabled: true
                      status: "ACTIVE"
                      is_deleted: false
                      created_at: "2023-01-01T12:00:00Z"
                      last_modified: "2023-01-01T12:00:00Z"
                  meta:
                    total: 1
                    page: 1
                    limit: 10
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Get notification by ID
      description: |
        Retrieve detailed information about a specific notification by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to retrieve
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Notification details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification retrieved successfully"
                data:
                  id: "60d5f1f9e6b3f3b3f3b3f3b3"
                  title: "Scheduled Maintenance"
                  notification_type: "SYSTEM_ALERT"
                  notification_body: "System maintenance scheduled for tomorrow at 2 AM"
                  is_public: true
                  for: "ALL"
                  created_by: "user123"
                  notification_parts: null
                  seen: false
                  enabled: true
                  status: "ACTIVE"
                  is_deleted: false
                  created_at: "2023-01-01T12:00:00Z"
                  last_modified: "2023-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    put:
      tags:
        - Notifications
      summary: Update a notification
      description: |
        Update an existing notification with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to update
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notification updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification updated successfully"
                data:
                  id: "60d5f1f9e6b3f3b3f3b3f3b3"
                  title: "Updated Maintenance Schedule"
                  notification_type: "SYSTEM_ALERT"
                  notification_body: "System maintenance rescheduled for next week"
                  is_public: true
                  for: "ALL"
                  created_by: "user123"
                  notification_parts: null
                  seen: false
                  enabled: true
                  status: "ACTIVE"
                  is_deleted: false
                  created_at: "2023-01-01T12:00:00Z"
                  last_modified: "2023-01-01T13:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Notifications
      summary: Delete a notification
      description: |
        Delete a notification by its ID (soft delete).
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to delete
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Notification deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification deleted successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /notifications/{id}/enable:
    post:
      tags:
        - Notifications
      summary: Enable a notification
      description: |
        Enable a notification by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to enable
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Notification enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification enabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /notifications/{id}/disable:
    post:
      tags:
        - Notifications
      summary: Disable a notification
      description: |
        Disable a notification by its ID.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to disable
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      responses:
        '200':
          description: Notification disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Notification disabled successfully"
                data: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested notification does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
