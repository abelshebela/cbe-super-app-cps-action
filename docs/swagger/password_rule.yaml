openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Password Rules API
  description: |
    This API provides endpoints for managing password rules in the CBE Super App CPS Action module.
    It allows retrieving password rules, updating them, and checking password compliance.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    PasswordRuleUpdate:
      type: object
      required:
        - name
        - min_length
        - max_length
      properties:
        name:
          type: string
          description: Name of the password rule
          example: "Standard Password Rules"
          pattern: "^[a-zA-Z0-9\\s._-]+$"
        min_length:
          type: integer
          description: Minimum password length
          minimum: 1
          example: 8
        max_length:
          type: integer
          description: Maximum password length
          minimum: 1
          example: 32
        numbers:
          type: boolean
          description: Whether numbers are required
          example: true
        capital_letters:
          type: boolean
          description: Whether capital letters are required
          example: true
        small_letters:
          type: boolean
          description: Whether small letters are required
          example: true
        characters:
          type: boolean
          description: Whether special characters are required
          example: true
    
    CheckPasswordDTO:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: The password to check against the rules
          example: "MySecurePassword123!"
    
    PasswordRuleResponse:
      type: object
      properties:
        _id:
          type: string
          description: Unique identifier for the password rule
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
        name:
          type: string
          description: Name of the password rule
          example: "Standard Password Rules"
        min_length:
          type: integer
          description: Minimum password length
          example: 8
        max_length:
          type: integer
          description: Maximum password length
          example: 32
        numbers:
          type: boolean
          description: Whether numbers are required
          example: true
        capital_letters:
          type: boolean
          description: Whether capital letters are required
          example: true
        small_letters:
          type: boolean
          description: Whether small letters are required
          example: true
        characters:
          type: boolean
          description: Whether special characters are required
          example: true
        created_at:
          type: string
          format: date-time
          description: When the password rule was created
          example: "2023-01-01T12:00:00Z"
    
    PasswordCheckResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 200
        message:
          type: string
          description: Description of the password check result
          example: "Password meets all requirements"
        data:
          type: object
          properties:
            valid:
              type: boolean
              description: Whether the password meets all requirements
              example: true
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          oneOf:
            - $ref: '#/components/schemas/PasswordRuleResponse'
            - type: array
              items:
                $ref: '#/components/schemas/PasswordRuleResponse'
            - type: object
              properties: {}
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERR_INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request parameters"

security:
  - BearerAuth: []

tags:
  - name: Password Rules
    description: Operations related to password rule management

paths:
  /password-rules:
    get:
      tags:
        - Password Rules
      summary: Get all password rules
      description: |
        Retrieve a list of all password rules with pagination.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Password rules retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Password rules retrieved successfully"
                data:
                  - _id: "60d5f1f9e6b3f3b3f3b3f3b3"
                    name: "Standard Password Rules"
                    min_length: 8
                    max_length: 32
                    numbers: true
                    capital_letters: true
                    small_letters: true
                    characters: true
                    created_at: "2023-01-01T12:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /password-rules/{id}:
    put:
      tags:
        - Password Rules
      summary: Update a password rule
      description: |
        Update an existing password rule with the provided details.
        This endpoint requires authentication and appropriate permissions.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the password rule to update
          schema:
            type: string
          example: "60d5f1f9e6b3f3b3f3b3f3b3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRuleUpdate'
      responses:
        '200':
          description: Password rule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Password rule updated successfully"
                data:
                  _id: "60d5f1f9e6b3f3b3f3b3f3b3"
                  name: "Updated Password Rules"
                  min_length: 10
                  max_length: 30
                  numbers: true
                  capital_letters: true
                  small_letters: true
                  characters: true
                  created_at: "2023-01-01T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /password-rules/check:
    post:
      tags:
        - Password Rules
      summary: Check password against rules
      description: |
        Check if a password meets all the configured password rules.
        This endpoint requires authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckPasswordDTO'
      responses:
        '200':
          description: Password check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordCheckResponse'
              example:
                status: 200
                message: "Password meets all requirements"
                data:
                  valid: true
        '400':
          description: Password does not meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordCheckResponse'
              example:
                status: 400
                message: "Password must be at least 8 characters long"
                data:
                  valid: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  
  responses:
    BadRequest:
      description: Bad request - Invalid parameters or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found - The requested password rule does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
