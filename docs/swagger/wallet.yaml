openapi: 3.0.3
info:
  title: CBE Super App CPS Action - Wallet API
  description: |
    This API provides endpoints for managing wallets in the CBE Super App CPS Action module.
    It allows creating, reading, updating, and deleting wallet information, as well as enabling/disabling wallets.
  version: 1.0.0
  contact:
    name: CBE Super App Support
    email: support@cbe.com.et

servers:
  - url: /api/v1/cbesuperapp/cps_action
    description: CBE Super App CPS Action API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Wallet:
      type: object
      required:
        - name
        - code
      properties:
        _id:
          type: string
          description: Unique identifier for the wallet
          example: 5f9d7b3b9d5f3b2a1c9d5f3c
        name:
          type: string
          description: Name of the wallet
          example: Mobile Wallet
        avatar:
          type: string
          description: URL to the wallet's avatar image
          example: https://example.com/wallet-avatar.png
        code:
          type: string
          description: Wallet code
          example: MW001
        enabled:
          type: boolean
          description: Whether the wallet is enabled
          example: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        last_modified_at:
          type: string
          format: date-time
          description: Last modification timestamp
    
    CreateWalletRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          description: Name of the wallet
          example: Mobile Wallet
        code:
          type: string
          description: Wallet code
          example: MW001
        avatar:
          type: string
          format: binary
          description: Wallet avatar image file (JPEG, PNG, GIF, or WebP, max 2MB)
    
    UpdateWalletRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the wallet
          example: Mobile Wallet Updated
        code:
          type: string
          description: Wallet code
          example: MW001UPD
        avatar:
          type: string
          format: binary
          description: New wallet avatar image file (JPEG, PNG, GIF, or WebP, max 2MB)
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ERR_BAD_REQUEST
            message:
              type: string
              example: Invalid request parameters
            details:
              type: object
              nullable: true

security:
  - BearerAuth: []

tags:
  - name: Wallets
    description: Wallet management operations

paths:
  /wallets:
    get:
      tags:
        - Wallets
      summary: Get all wallets
      description: Retrieve a list of all wallets with pagination support
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of wallets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallets retrieved successfully
                data:
                  items:
                    - _id: 5f9d7b3b9d5f3b2a1c9d5f3c
                      name: Mobile Wallet
                      avatar: https://example.com/wallet-avatar.png
                      code: MW001
                      enabled: true
                      created_at: '2023-10-01T10:00:00Z'
                      last_modified_at: '2023-10-01T10:00:00Z'
                  total: 1
                  page: 1
                  limit: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    
    post:
      tags:
        - Wallets
      summary: Create a new wallet
      description: Create a new wallet with the provided details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet created successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /wallets/{id}:
    get:
      tags:
        - Wallets
      summary: Get a wallet by ID
      description: Retrieve detailed information about a specific wallet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
      responses:
        '200':
          description: Wallet details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet retrieved successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3c
                  name: Mobile Wallet
                  avatar: https://example.com/wallet-avatar.png
                  code: MW001
                  enabled: true
                  created_at: '2023-10-01T10:00:00Z'
                  last_modified_at: '2023-10-01T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    patch:
      tags:
        - Wallets
      summary: Update a wallet
      description: Update wallet details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateWalletRequest'
      responses:
        '200':
          description: Wallet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet updated successfully
                data:
                  _id: 5f9d7b3b9d5f3b2a1c9d5f3c
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    
    delete:
      tags:
        - Wallets
      summary: Delete a wallet
      description: Delete a wallet by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
      responses:
        '200':
          description: Wallet deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet deleted successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /wallets/{id}/enable:
    patch:
      tags:
        - Wallets
      summary: Enable a wallet
      description: Enable a previously disabled wallet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
      responses:
        '200':
          description: Wallet enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet enabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /wallets/{id}/disable:
    patch:
      tags:
        - Wallets
      summary: Disable a wallet
      description: Disable a wallet (soft delete)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
      responses:
        '200':
          description: Wallet disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Wallet disabled successfully
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
