      tags:
      - Product Code
    patch:
      consumes:
      - application/json
      description: Updates an existing product code by its ID. This is a pending action
        that requires approval.
      parameters:
      - description: Product Code ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Product Code Request
        in: body
        name: productCode
        required: true
        schema:
          $ref: '#/definitions/productcode.UpdateProductCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/model.ProductCode'
            type: object
        "400":
