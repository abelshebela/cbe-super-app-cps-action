basePath: /api/v1/cbesuperapp/cps_action
definitions:
  accountblock.EnableOrDisableBranches:
    properties:
      branches_code:
        example:
        - BR001
        - BR002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableCities:
    properties:
      city_code:
        example:
        - CT001
        - CT002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableDistricts:
    properties:
      districts_code:
        example:
        - DS001
        - DS002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableRegions:
    properties:
      regions_code:
        example:
        - RG001
        - RG002
        items:
          type: string
        type: array
    type: object
  accountvalidation.ValidationRuleDTO:
    properties:
      enabled:
        type: boolean
      entity_type:
        type: string
      id:
        type: string
      identifier:
        type: string
      is_deleted:
        type: boolean
      max_length:
        type: integer
      min_length:
        type: integer
      service_id:
        type: string
      validation_for:
        type: string
    type: object
  constants.AccountStatus:
    enum:
    - ACTIVE
    - INACTIVE
    type: string
    x-enum-varnames:
    - Active
    - InActive
  constants.BPSStatus:
    enum:
    - AUTHORIZED
    - DENIED
    - PENDING
    - INITIATED
    type: string
    x-enum-varnames:
    - BPSStatusAuthorized
    - BPSStatusDenied
    - BPSStatusPending
    - BPSStatusInitiated
  constants.DeviceStatus:
    enum:
    - LINKED
    - UNLINKED
    type: string
    x-enum-varnames:
    - Linked
    - UnLinked
  constants.Gender:
    enum:
    - MALE
    - FEMALE
    type: string
    x-enum-varnames:
    - Male
    - Female
  constants.KYCStatus:
    enum:
    - PENDING
    - APPROVED
    - REJECTED
    type: string
    x-enum-varnames:
    - KYCStatusPending
    - KYCStatusApproved
    - KYCStatusRejected
  constants.MemberType:
    enum:
    - CB
    - IFB
    type: string
    x-enum-varnames:
    - CBT
    - IFBT
  constants.Platform:
    enum:
    - ANDROID
    - IOS
    type: string
    x-enum-varnames:
    - Android
    - Ios
  constants.Realm:
    enum:
    - ELST
    - BANK
    - DISTRICT
    - BRANCH
    - MERCHANT
    - COMPANY
    - MEMBER
    type: string
    x-enum-varnames:
    - ELST_REALM
    - BANK_REALM
    - DISTRICT_REALM
    - BRANCH_REALM
    - MERCHANT_REALM
    - COMPANY_REALM
    - MEMBER_REALM
  localization.ResponseCode:
    properties:
      code:
        type: string
      message:
        type: string
      status_code:
        type: integer
      timestamp:
        type: string
      type:
        description: '"success", "error", "warning", "info"'
        type: string
    type: object
  model.APIResponse:
    properties:
      data: {}
      message:
        type: string
      ok:
        type: boolean
      status:
        type: integer
      timestamp:
        type: string
    type: object
  model.ProductCode:
    properties:
      cbe_ifb_product_codes:
