basePath: /api/v1/cbesuperapp/cps_action
definitions:
  accountblock.EnableOrDisableBranches:
    properties:
      branches_code:
        example:
        - BR001
        - BR002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableCities:
    properties:
      city_code:
        example:
        - CT001
        - CT002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableDistricts:
    properties:
      districts_code:
        example:
        - DS001
        - DS002
        items:
          type: string
        type: array
    type: object
  accountblock.EnableOrDisableRegions:
    properties:
      regions_code:
        example:
        - RG001
        - RG002
        items:
          type: string
        type: array
    type: object
  accountvalidation.ValidationRuleDTO:
    properties:
      enabled:
        type: boolean
      entity_type:
        type: string
      id:
        type: string
      identifier:
        type: string
      is_deleted:
        type: boolean
      max_length:
        type: integer
      min_length:
        type: integer
      service_id:
        type: string
      validation_for:
        type: string
    type: object
  localization.ResponseCode:
    properties:
      code:
        type: string
      message:
        type: string
      status_code:
        type: integer
      timestamp:
        type: string
      type:
        description: '"success", "error", "warning", "info"'
        type: string
    type: object
  model.ProductCode:
    properties:
      cbe_ifb_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      cbe_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      created_at:
        type: string
      id:
        type: string
      last_modified_at:
        type: string
      service_name:
        type: string
    type: object
  model.ProductCodes:
    properties:
      prd:
        type: string
      sfprd:
        type: string
      trxn:
        type: string
      vatprd:
        type: string
    type: object
  productcode.ProductCodePaginatedResponse:
    type: object
  productcode.ProductCodeResponse:
    properties:
      cbe_ifb_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      cbe_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      created_at:
        type: string
      id:
        type: string
      last_modified_at:
        type: string
      product_name:
        type: string
    type: object
  productcode.UpdateProductCodeRequest:
    properties:
      cbe_ifb_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      cbe_product_codes:
        $ref: '#/definitions/model.ProductCodes'
      id:
        type: string
      product_name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: contact@eaglelionsystems.com
    name: API Support
  description: API documentation for CPS Action service
  title: CPS Action API
  version: 1.0.0
paths:
  /account_block/branches:
    get:
      consumes:
      - application/json
      description: Retrieve all branches with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branches retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all branches
      tags:
      - Account Block - Branches
  /account_block/branches/{branch_code}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific branch by its branch code
      parameters:
      - description: Branch Code
        in: path
        name: branch_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branch retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get branch by code
      tags:
      - Account Block - Branches
  /account_block/branches/disable:
    post:
      consumes:
      - application/json
      description: Disable one or more branches by their branch codes
      parameters:
      - description: Branch codes to disable
        in: body
