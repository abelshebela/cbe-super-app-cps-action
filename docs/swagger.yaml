paths:
  /account_block/branches:
    get:
      consumes:
      - application/json
      description: Retrieve all branches with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branches retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all branches
      tags:
      - Account Block - Branches
  /account_block/branches/{branch_code}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific branch by its branch code
