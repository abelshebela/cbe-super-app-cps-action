host: localhost:8080
info:
  contact:
    email: contact@eaglelionsystems.com
    name: API Support
  description: API documentation for CPS Action service
  title: CPS Action API
  version: 1.0.0
paths:
  /account_block/branches:
    get:
      consumes:
      - application/json
      description: Retrieve all branches with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branches retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all branches
      tags:
      - Account Block - Branches
  /account_block/branches/{branch_code}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific branch by its branch code
      parameters:
      - description: Branch Code
        in: path
        name: branch_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branch retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get branch by code
      tags:
      - Account Block - Branches
  /account_block/branches/disable:
    post:
      consumes:
      - application/json
      description: Disable one or more branches by their branch codes
      parameters:
      - description: Branch codes to disable
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cbe-super-app-cps-action_internal_constants_dto_account_block.EnableOrDisableBranches'
      produces:
      - application/json
      responses:
        "200":
          description: Branches disabled successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Disable branches
      tags:
      - Account Block - Branches
  /account_block/branches/enable:
    post:
      consumes:
      - application/json
      description: Enable one or more branches by their branch codes
      parameters:
      - description: Branch codes to enable
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cbe-super-app-cps-action_internal_constants_dto_account_block.EnableOrDisableBranches'
      produces:
      - application/json
      responses:
        "200":
          description: Branches enabled successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Enable branches
      tags:
      - Account Block - Branches
  /account_block/city:
    get:
      consumes:
      - application/json
      description: Retrieve all cities with pagination
