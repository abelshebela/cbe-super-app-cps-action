            $ref: '#/definitions/localization.ResponseCode'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/localization.ResponseCode'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/localization.ResponseCode'
      security:
      - BearerAuth: []
      summary: Update a product code
      tags:
      - Product Code
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
