paths:
  /account_block/branches:
    get:
      consumes:
      - application/json
      description: Retrieve all branches with pagination and optional filters.
      parameters:
      - default: 1
        description: Page number
        example: 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page
        example: 10
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - description: Search term
        example: '"Addis"'
        in: query
        name: search
        type: string
      - description: JSON encoded filters (enabled, region, district)
        example: '"{\"enabled\":true}"'
        in: query
        name: filters
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Branches retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/localization.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/accountblock.paginated_account_block_resp'
              type: object
        "500":
          description: internal Server error
          schema:
            allOf:
            - $ref: '#/definitions/localization.StandardResponse'
            - properties:
                data:
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Get all branches
      tags:
      - Account Block - Branches
  /account_block/branches/{branch_code}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific branch by its branch code.
      parameters:
      - description: Branch Code
        example: BR001
        in: path
        name: branch_code
        required: true
        type: string
      produces:
      - application/json
      responses:
