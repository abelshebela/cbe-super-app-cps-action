version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/"
    gen:
      go:
        package: "sqlc"
        out: "../internal/storage/persistance/bankvault/gen/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "string"

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - db_type: "text"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"

          - db_type: "accrual_method"
            go_type: "cbe-super-app-cps-action/internal/constants.AccrualMethod"
          - db_type: "accrual_frequency"
            go_type: "cbe-super-app-cps-action/internal/constants.AccrualFrequency"
          - db_type: "locked_vault_status"
            go_type: "cbe-super-app-cps-action/internal/constants.VaultStatus"

          - column: "bank_vault_products.lock_period"
            go_type:
              import: "time"
              type: "Duration"
          # - column: "locked_vaults.lock_period"
          #   go_type:
          #     import: "time"
          #     type: "Duration"

  - engine: "postgresql"
    schema: "migrations/"
    queries: "queries/vault_group_catagory.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/storage/persistance/vaultgroupcategory/gen/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "string"

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - db_type: "text"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
