version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations_pg/"
    queries: "queries/vault_group_catagory.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/storage/persistance/vaultgroup_category/gen/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "string"

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"

