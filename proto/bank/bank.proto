syntax = "proto3";

package bank;

option go_package = "github.com/CBE-Super-App/cbe-super-app-cps-action/internal/grpc/pb";

import "google/protobuf/timestamp.proto";

// Bank message definition
message Bank {
  string id = 1;
  string name = 2;
  string logo = 3;
  string code = 4;
  string bic = 5;
  bool enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_modified_at = 8;
}

// Request messages
message GetBankRequest {
  string id = 1;
}

message GetAllBanksRequest {
  int32 page = 1;
  int32 per_page = 2;
  string search = 3;
  string sort_by = 4;
  string sort_order = 5;
}

message CreateBankRequest {
  string name = 1;
  string code = 2;
  string bic = 3;
  bytes logo = 4;
}

message UpdateBankRequest {
  string id = 1;
  string name = 2;
  string code = 3;
  string bic = 4;
}

message DeleteBankRequest {
  string id = 1;
}

message EnableDisableBankRequest {
  string id = 1;
  bool enable = 2;
}

message UpdateBankLogoRequest {
  string id = 1;
  bytes logo = 2;
}

// Response messages
message GetBankResponse {
  Bank bank = 1;
  string message = 2;
}

message GetAllBanksResponse {
  repeated Bank banks = 1;
  int32 total = 2;
  int32 page = 3;
  int32 per_page = 4;
  int32 total_pages = 5;
  string message = 6;
}

message CreateBankResponse {
  string message = 1;
  string action_code = 2;
}

message UpdateBankResponse {
  string message = 1;
  string action_code = 2;
}

message DeleteBankResponse {
  string message = 1;
  string action_code = 2;
}

message EnableDisableBankResponse {
  string message = 1;
  string action_code = 2;
}

message UpdateBankLogoResponse {
  string message = 1;
  string action_code = 2;
}

// Bank service definition
service BankService {
  // Get a single bank by ID
  rpc GetBank(GetBankRequest) returns (GetBankResponse);
  
  // Get all banks with pagination and filtering
  rpc GetAllBanks(GetAllBanksRequest) returns (GetAllBanksResponse);
  
  // Create a new bank
  rpc CreateBank(CreateBankRequest) returns (CreateBankResponse);
  
  // Update an existing bank
  rpc UpdateBank(UpdateBankRequest) returns (UpdateBankResponse);
  
  // Delete a bank
  rpc DeleteBank(DeleteBankRequest) returns (DeleteBankResponse);
  
  // Enable or disable a bank
  rpc EnableDisableBank(EnableDisableBankRequest) returns (EnableDisableBankResponse);
  
  // Update bank logo
  rpc UpdateBankLogo(UpdateBankLogoRequest) returns (UpdateBankLogoResponse);
}
